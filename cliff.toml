# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# The changelog is generated, never edited by hand. A release goes on top of
# the ones before it:
#   git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md

[changelog]
# The same text CHANGELOG.md starts with, byte for byte: `--prepend` knows it
# as the header and keeps it on top, the new release under it.
header = """
# Changelog

All notable changes to efema are documented here, generated from the commit
history by [git-cliff](https://git-cliff.org).

What a device writes is a contract of five parts, each with a version of its
own: the protocol (1, paths under `/v1`), the sealed blob and the lock (1),
the entry (2), the key entry (1) and a stream's layout in a bucket (1) - see
https://lacodda.github.io/efema/reference/format/. A change to any of them is
a new version of that part, with a "Breaking Changes" section here and the way
across, or a plain statement that there is none. The relay's database and the
client's state file carry schema versions of their own, checked before
reading, and each release carries an older one forward.

`lacodda-seal` and `lacodda-tear` keep versions of their own (lacodda-seal
0.1.0 since efema 0.2.0, lacodda-tear 0.1.0 since efema 0.4.0 and 0.1.1 since 0.6.0); their changes
are listed under the efema release they shipped with.

A release is added with:

```console
$ git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md
```
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### Breaking Changes
{% for commit in breaking %}
- **{{ commit.message | upper_first }}**{% if commit.breaking_description and commit.breaking_description != commit.message %}: {{ commit.breaking_description | trim }}{% endif %}\
{% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\
"""
# Not trimmed, and the body ends on its last line: a release prepended lands
# one blank line above the release before it.
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# git-cliff orders groups by name; the comment in front of each sets the
# order a reader wants - what changed for them first - and is stripped from
# the heading.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  # `lyrn upgrade` commits the line's standard it brings as chore(standard).
  { message = "^chore\\(standard\\)", group = "<!-- 8 -->Standard" },
  { message = "^chore", skip = true },
]
