# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# The changelog is generated, never edited by hand:
#   git cliff --tag vX.Y.Z --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to efema are documented here, generated from the commit
history by [git-cliff](https://git-cliff.org).

The protocol and the relay's database are versioned on their own: the wire
format is protocol version 1 (paths under `/v1`), and the database carries a
schema version a relay checks before reading. Any change that breaks either -
or the cursor's hash chain, which every client holds - gets a "Breaking
Changes" section here, with the way across or a plain statement that there is
none.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### Breaking Changes
{% for commit in breaking %}
- **{{ commit.message | upper_first }}**{% if commit.breaking_description and commit.breaking_description != commit.message %}: {{ commit.breaking_description | trim }}{% endif %}\
{% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore", skip = true },
]
