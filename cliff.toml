# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# The changelog is generated, never edited by hand:
#   git cliff --tag vX.Y.Z --output CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to efema are documented here, generated from the commit
history by [git-cliff](https://git-cliff.org).

The protocol, the relay's database and the client's state file are versioned
on their own: the wire format is protocol version 1 (paths under `/v1`), and
each database carries a schema version checked before reading. Any change that
breaks one of them - or the cursor's hash chain, or the sealing formats every
stream is written in - gets a "Breaking Changes" section here, with the way
across or a plain statement that there is none.

`lacodda-seal` and `lacodda-tear` keep versions of their own (lacodda-seal
0.1.0 since efema 0.2.0, lacodda-tear 0.1.0 since efema 0.4.0); their changes
are listed under the efema release they shipped with.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking | length > 0 %}
### Breaking Changes
{% for commit in breaking %}
- **{{ commit.message | upper_first }}**{% if commit.breaking_description and commit.breaking_description != commit.message %}: {{ commit.breaking_description | trim }}{% endif %}\
{% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# git-cliff orders groups by name; the comment in front of each sets the
# order a reader wants - what changed for them first - and is stripped from
# the heading.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build", group = "<!-- 6 -->Build" },
  { message = "^ci", group = "<!-- 7 -->CI" },
  { message = "^chore", skip = true },
]
