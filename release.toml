# How efema is released, read by furca's release engine: `furca release
# plan` says what the next release is and what stands in its way, `furca
# release run` carries it out - bump, changelog, gate, commit, push, green CI,
# tag, publish, install, deploy - and checks what went out. `lyrn check` reads
# it too.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "efema"
changelog = "CHANGELOG.md"
# The workspace root carries the version of efema-proto, efema-server and
# efema, and of the path dependencies between them.
manifests = ["Cargo.toml"]
# Left as written: ADRs record what happened, and the changelog's header in
# cliff.toml - byte for byte the one CHANGELOG.md starts with - says which
# efema release each of the line's crates first shipped with.
as_written = ["docs/adr/", "cliff.toml"]

[gate]
# Formatting only: it takes seconds and compiles nothing. The rest of the gate
# is CI, which the run waits for before the tag.
commands = [
    "cargo fmt --all --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
publish = "publish.yml"

# In publishing order: the relay and the client depend on the wire format.
[[package]]
registry = "crates"
name = "efema-proto"
manifest = "crates/efema-proto/Cargo.toml"

[[package]]
registry = "crates"
name = "efema-server"
manifest = "crates/efema-server/Cargo.toml"

[[package]]
registry = "crates"
name = "efema"
manifest = "crates/efema/Cargo.toml"

# The files the tag's release page has to carry: checked after the publish,
# and against the targets the installers ask for on every commit.
[page]
assets = [
    "efema-server-{tag}-x86_64-pc-windows-msvc.zip",
    "efema-server-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "efema-server-{tag}-aarch64-unknown-linux-gnu.tar.gz",
    "efema-server-{tag}-aarch64-apple-darwin.tar.gz",
]

# The relay is installed from the release by tools/install.ps1 and
# tools/install.sh, and proven to be the release's own build.
[post.install]
bin = "efema-server"

# And the stand is moved onto it: turnout's own configuration names the stand,
# checks its health through the door and rolls a failed deploy back.
[post.deploy]
