[workspace]
members = ["crates/efema-proto", "crates/efema-server", "crates/efema", "crates/lacodda-seal", "crates/lacodda-tear", "examples/mini-vault"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
description = "A sync relay for local-first apps: it keeps changes in order and cannot read them"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
license = "MIT"
repository = "https://github.com/lacodda/efema"
homepage = "https://lacodda.github.io/efema/"

[workspace.dependencies]
efema-proto = { path = "crates/efema-proto", version = "0.8.0" }
efema = { path = "crates/efema", version = "0.8.0" }
efema-server = { path = "crates/efema-server", version = "0.8.0" }
lacodda-seal = { path = "crates/lacodda-seal", version = "0.1.0" }
lacodda-tear = { path = "crates/lacodda-tear", version = "0.1.1" }

# The wire format: CBOR with integer keys, decoded strictly. Derives keep each
# message one definition; unknown keys are skipped, so a field added later does
# not break an older peer.
minicbor = { version = "2", features = ["alloc", "derive"] }
sha2 = "0.11"

# Sealing (lacodda-seal): the same audited RustCrypto primitives sefy's vaults
# use. Default features off - argon2's password-hash string format and the
# AEAD's own nonce source are not used; nonces and salts come from getrandom.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1"

# Entries are compressed before they are sealed (ciphertext does not
# compress). The binding to the reference library: every consumer builds with
# a C toolchain anyway, and the frame format is the standard one another
# language reads with its own zstd. Default features off - the legacy formats
# and the dictionary builder are not used.
zstd = { version = "0.14", default-features = false }

anyhow = "1"
# HTTP/1.1 only: TLS and HTTP/2 belong to the reverse proxy in front (the
# relay never terminates TLS itself), and HTTP/1.1 is what that proxy speaks to
# its upstream.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# The client's HTTP: HTTP/1.1 like the relay, rustls with the platform's
# trust store, so a relay behind a proxy with a private CA (Caddy's
# `tls internal`) is trusted once the CA is installed on the device.
# Tests talk to the relay over a real socket through it, the way a client does.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The vocabulary of reqwest's own body type, for a request body handed to the
# connection a piece at a time: each piece taken is progress, the way the
# client tells a stalled connection from a slow one.
bytes = "1"
http-body = "1"
tempfile = "3"

# Argon2id is meant to be expensive, and an unoptimized build makes it about
# ten times more so: tests that unlock keys would spend minutes on it. Only
# the hashing crates are optimized; everything else keeps a debug build.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# A release binary is downloaded far more often than it is built. Link-time
# optimization across one codegen unit and a stripped symbol table roughly
# halve it, at the cost of a slower release build.
[profile.release]
lto = true
codegen-units = 1
strip = true
