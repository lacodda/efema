[package]
name = "efema-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The efema relay: keeps sealed batches in order, by cursor, for the devices that sync through it"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://lacodda.github.io/efema/"
keywords = ["sync", "local-first", "relay", "server"]
categories = ["network-programming", "web-programming::http-server"]

[[bin]]
name = "efema-server"
path = "src/main.rs"

[dependencies]
efema-proto.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dirs.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Only for tests/release_consistency.rs, which holds the sealing page to the
# formats the client and its sealing crate write. Path only: a dev-dependency
# without a version is left out when the crate is published, so the relay
# does not wait on crates.io for crates published after it.
efema = { path = "../efema" }
lacodda-seal = { path = "../lacodda-seal" }
minicbor.workspace = true
reqwest.workspace = true
tempfile.workspace = true
