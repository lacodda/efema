[package]
name = "efema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The efema client: sync sealed changes between devices through a relay that cannot read them"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/efema"
keywords = ["sync", "local-first", "encryption", "relay", "client"]
categories = ["network-programming", "cryptography"]

[dependencies]
efema-proto.workspace = true
lacodda-seal.workspace = true

bytes.workspace = true
getrandom.workspace = true
http-body.workspace = true
minicbor.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
zstd.workspace = true

[dev-dependencies]
# Tests talk to a real relay. Published before this crate (publish.yml), so
# the version this names is on crates.io when the client goes up.
efema-server.workspace = true
# Tests against connections torn the way a network tears them. Published
# before this crate, like efema-server.
lacodda-tear.workspace = true
tempfile.workspace = true
# A paused clock: how long a request may stay still is shown in seconds that
# do not have to pass.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
