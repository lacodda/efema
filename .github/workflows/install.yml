name: Install

# The installers, run the way a person runs them, against a real release: the
# one the Release workflow just made, the one asked for, or the latest when
# the scripts change. Each run checks the version that answers, so green means
# the release can be installed as the README says. On Linux the relay is also
# set up as a service, twice: the second time is an upgrade, which stops it,
# copies its data aside and starts it again.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  push:
    branches: [main]
    paths: ['tools/install.ps1', 'tools/install.sh', 'tools/service.sh', '.github/workflows/install.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: The release to install - empty for the latest
        required: false

permissions:
  contents: read

env:
  # A tag push names its tag as the branch of the run it started; empty means
  # the latest release.
  EFEMA_SERVER_VERSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}

jobs:
  unix:
    name: ${{ matrix.os }}
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        # The ARM runner stands for a Raspberry Pi.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Piped into sh, as the README says - not run as a file.
      - name: Install
        run: cat tools/install.sh | sh
      - name: Check what answers
        run: |
          version=$("$HOME/.local/bin/efema-server" --version)
          echo "$version"
          if [ -n "$EFEMA_SERVER_VERSION" ]; then test "$version" = "efema-server ${EFEMA_SERVER_VERSION#v}"; fi
      # As the release engine proves a release: into a scratch directory, the
      # PATH left out of it.
      - name: Into a scratch directory
        run: |
          said=$(cat tools/install.sh | EFEMA_SERVER_INSTALL_DIR="$RUNNER_TEMP/scratch" EFEMA_SERVER_NO_PATH=1 sh)
          echo "$said"
          "$RUNNER_TEMP/scratch/efema-server" --version
          if echo "$said" | grep -q PATH; then echo "the install talked about the PATH" >&2; exit 1; fi
      - name: As a service, set up and upgraded
        if: runner.os == 'Linux'
        run: |
          cat tools/install.sh | sudo EFEMA_SERVER_VERSION="$EFEMA_SERVER_VERSION" EFEMA_SERVER_INSTALL_DIR=/usr/local/bin sh
          sudo sh tools/service.sh
          sudo -u efema efema-server keys add ci write --label install --data /var/lib/efema >/dev/null
          sudo sh tools/service.sh
          test -n "$(sudo ls /var/lib/efema.backups)"
          curl -fsS http://127.0.0.1:2451/health
          sudo -u efema efema-server keys --data /var/lib/efema
      # The stand's own command, as a deploy runs it there: what
      # tools/stand/stage.sh assembles, put over the service set up above.
      # Only for a release just made - the version the stage names is the
      # manifest's, which is out only once its release is.
      - name: As a stand, upgraded
        if: runner.os == 'Linux' && github.event_name == 'workflow_run'
        run: |
          sh tools/stand/stage.sh "$RUNNER_TEMP/stand"
          sudo sh "$RUNNER_TEMP/stand/stand.sh"
          curl -fsS http://127.0.0.1:2451/health
          test "$(efema-server --version)" = "efema-server $(cut -c2- "$RUNNER_TEMP/stand/VERSION")"

  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Piped into iex, as the README says - not run as a file, which would
      # forgive what iex does not.
      - name: Install
        shell: powershell
        run: Get-Content -Raw tools/install.ps1 | Invoke-Expression
      - name: Check what answers
        shell: powershell
        run: |
          $version = & (Join-Path $env:LOCALAPPDATA "Programs\efema\efema-server.exe") --version
          $version
          if ($env:EFEMA_SERVER_VERSION -and $version -ne "efema-server $($env:EFEMA_SERVER_VERSION.TrimStart('v'))") { throw "installed $version" }
      # As the release engine proves a release: into a scratch directory, the
      # user PATH exactly as it was.
      - name: Into a scratch directory
        shell: powershell
        run: |
          $before = (Get-Item HKCU:\Environment).GetValue("Path", "", "DoNotExpandEnvironmentNames")
          $env:EFEMA_SERVER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "scratch"
          $env:EFEMA_SERVER_NO_PATH = "1"
          Get-Content -Raw tools/install.ps1 | Invoke-Expression
          & (Join-Path $env:EFEMA_SERVER_INSTALL_DIR "efema-server.exe") --version
          $after = (Get-Item HKCU:\Environment).GetValue("Path", "", "DoNotExpandEnvironmentNames")
          if ($after -ne $before) { throw "the user PATH changed: $after" }
      # A relay serving on this machine holds its exe open; the upgrade moves
      # it aside instead of failing, and the relay serves on.
      - name: Upgraded while the relay runs
        shell: powershell
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\efema"
          $relay = Start-Process (Join-Path $dir "efema-server.exe") -ArgumentList "serve", "--data", (Join-Path $env:RUNNER_TEMP "relay") -PassThru
          Start-Sleep -Seconds 3
          if ($relay.HasExited) { throw "the relay did not start" }
          Get-Content -Raw tools/install.ps1 | Invoke-Expression
          if ($relay.HasExited) { throw "the upgrade stopped the relay" }
          if (-not (Get-ChildItem $dir -Filter "efema-server.exe.old-*")) { throw "nothing was moved aside" }
          Invoke-WebRequest -UseBasicParsing http://127.0.0.1:2451/health | Select-Object -ExpandProperty Content
          Stop-Process -Id $relay.Id
