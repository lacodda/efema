name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not filtered by path: tests/release_consistency.rs reads the documentation
  # pages, so a change under docs/ can break the Rust gate.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      # `--workspace` throughout: without it cargo only looks at the default
      # members, and a library crate can rot untested next to a green build.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The crates' reference lives on docs.rs; a broken link in it is
      # documentation that lies, so it fails here rather than there.
      - name: API docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The first sync of a vault, timed: 5080 files shaped like a working vault
  # go up to an empty relay and down to a second device, byte for byte. A
  # release build, because that is what an app ships; the limit is on the way
  # up - the library and the relay - and catches a regression, not a slow
  # runner.
  first-sync:
    name: first sync (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 5080 files up and down
        run: cargo run --release -p mini-vault --example first-sync -- --limit 30

  # The bucket transport against a real S3: MinIO, built from its source by
  # Chainguard - MinIO itself publishes no images any more. The bucket tests
  # skip themselves where there is no bucket; EFEMA_TEST_BUCKET_REQUIRED makes
  # that a failure here, so this job cannot go green without running them. The
  # first sync goes through the same bucket, held to the relay's limit.
  bucket:
    name: bucket (MinIO)
    runs-on: ubuntu-latest
    env:
      EFEMA_TEST_BUCKET: http://127.0.0.1:9000/efema-test
      EFEMA_TEST_BUCKET_REGION: us-east-1
      EFEMA_TEST_BUCKET_KEY: efema-ci
      EFEMA_TEST_BUCKET_SECRET: not-a-secret-a-throwaway-minio
      EFEMA_TEST_BUCKET_READER_KEY: efema-reader
      EFEMA_TEST_BUCKET_READER_SECRET: not-a-secret-either
      EFEMA_TEST_BUCKET_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Root inside the container: the image's own user cannot create the
      # data directory.
      - name: Start MinIO
        run: |
          docker run -d --name minio -u 0 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$EFEMA_TEST_BUCKET_KEY" -e MINIO_ROOT_PASSWORD="$EFEMA_TEST_BUCKET_SECRET" \
            cgr.dev/chainguard/minio:latest server /data
          for _ in $(seq 60); do curl -fs http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio
          exit 1
      # A user that lists and reads the bucket and writes nothing - the
      # credentials of a device that only reads.
      - name: Make the bucket, and credentials that only read it
        run: |
          cat > "$RUNNER_TEMP/read.json" <<'POLICY'
          {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["s3:GetObject", "s3:ListBucket"],
           "Resource": ["arn:aws:s3:::efema-test", "arn:aws:s3:::efema-test/*"]}]}
          POLICY
          mc() {
            docker run --rm --network host -v "$RUNNER_TEMP:/policy" \
              -e MC_HOST_ci="http://$EFEMA_TEST_BUCKET_KEY:$EFEMA_TEST_BUCKET_SECRET@127.0.0.1:9000" \
              cgr.dev/chainguard/minio-client:latest "$@"
          }
          mc mb ci/efema-test
          mc admin user add ci "$EFEMA_TEST_BUCKET_READER_KEY" "$EFEMA_TEST_BUCKET_READER_SECRET"
          mc admin policy create ci efema-read /policy/read.json
          mc admin policy attach ci efema-read --user "$EFEMA_TEST_BUCKET_READER_KEY"
      - name: Test against the bucket
        run: cargo test -p efema --test bucket
      - name: 5080 files up and down through the bucket
        run: cargo run --release -p mini-vault --example first-sync -- --bucket "$EFEMA_TEST_BUCKET" --region us-east-1 --limit 30
        env:
          AWS_ACCESS_KEY_ID: ${{ env.EFEMA_TEST_BUCKET_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.EFEMA_TEST_BUCKET_SECRET }}

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used - so read it from the manifest and hold it to it.
  #
  # `max` over every package, not `.packages[0]`: cargo does not promise the
  # order, and picking the first crate would test whichever one it happened to
  # list - green on the wrong half of the repository.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version] | max')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --workspace --all-targets

  # The format vectors come from a second implementation of the format, in
  # Python (ADR 0021): it writes them again here, and the file has to be what
  # it writes. The Rust side reads them back in the gate above. A venv, since
  # the runner's Python takes no packages system-wide.
  vectors:
    name: Format vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the vectors again, and compare
        run: |
          python3 -m venv "$RUNNER_TEMP/vectors"
          "$RUNNER_TEMP/vectors/bin/pip" install --quiet "cryptography>=44"
          "$RUNNER_TEMP/vectors/bin/python" tools/format-vectors.py --check
