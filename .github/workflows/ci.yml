name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Not filtered by path: tests/release_consistency.rs reads the documentation
  # pages, so a change under docs/ can break the Rust gate.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      # `--workspace` throughout: without it cargo only looks at the default
      # members, and a library crate can rot untested next to a green build.
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The crates' reference lives on docs.rs; a broken link in it is
      # documentation that lies, so it fails here rather than there.
      - name: API docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The first sync of a vault, timed: 5080 files shaped like a working vault
  # go up to an empty relay and down to a second device, byte for byte. A
  # release build, because that is what an app ships; the limit is on the way
  # up - the library and the relay - and catches a regression, not a slow
  # runner.
  first-sync:
    name: first sync (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 5080 files up and down
        run: cargo run --release -p mini-vault --example first-sync -- --limit 30

  # The bucket transport against a real S3: MinIO (.github/actions/minio).
  # The bucket tests skip themselves where there is no bucket;
  # EFEMA_TEST_BUCKET_REQUIRED makes that a failure here, so this job cannot go
  # green without running them. Temporary credentials come from MinIO's own
  # STS, asked with the first key. The first sync goes through the same bucket
  # with credentials of that kind, held to the relay's limit.
  bucket:
    name: bucket (MinIO)
    runs-on: ubuntu-latest
    env:
      EFEMA_TEST_BUCKET: http://127.0.0.1:9000/efema-test
      EFEMA_TEST_BUCKET_REGION: us-east-1
      EFEMA_TEST_BUCKET_KEY: efema-ci
      EFEMA_TEST_BUCKET_SECRET: not-a-secret-a-throwaway-minio
      EFEMA_TEST_BUCKET_READER_KEY: efema-reader
      EFEMA_TEST_BUCKET_READER_SECRET: not-a-secret-either
      EFEMA_TEST_BUCKET_PREFIXED_KEY: efema-prefixed
      EFEMA_TEST_BUCKET_PREFIXED_SECRET: not-a-secret-at-all
      EFEMA_TEST_BUCKET_STS: http://127.0.0.1:9000
      EFEMA_TEST_BUCKET_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/minio
      - name: Test against the bucket
        run: cargo test -p efema --test bucket
      # MinIO takes no role's name and hands out its own user's rights; the
      # ARN is the one its documentation asks for.
      - name: 5080 files up and down through the bucket, with temporary credentials
        run: |
          handed="$(AWS_ACCESS_KEY_ID="$EFEMA_TEST_BUCKET_KEY" AWS_SECRET_ACCESS_KEY="$EFEMA_TEST_BUCKET_SECRET" \
            aws sts assume-role --endpoint-url "$EFEMA_TEST_BUCKET_STS" --region us-east-1 \
              --role-arn arn:xxx:xxx:xxx:xxxx --role-session-name first-sync --output json)"
          export AWS_ACCESS_KEY_ID="$(jq -r .Credentials.AccessKeyId <<<"$handed")"
          export AWS_SECRET_ACCESS_KEY="$(jq -r .Credentials.SecretAccessKey <<<"$handed")"
          export AWS_SESSION_TOKEN="$(jq -r .Credentials.SessionToken <<<"$handed")"
          test -n "$AWS_SESSION_TOKEN" -a "$AWS_ACCESS_KEY_ID" != "$EFEMA_TEST_BUCKET_KEY"
          cargo run --release -p mini-vault --example first-sync -- --bucket "$EFEMA_TEST_BUCKET" --region us-east-1 --limit 30

  # Credentials that run out, at the pace the service sets: STS hands nothing
  # out for less than a quarter of an hour, so the one test that waits for
  # real credentials to run out takes that long - and has this job to itself,
  # beside the others rather than after them. `--ignored` runs it and nothing
  # else; `--exact` names it, so the job fails if the test is renamed away.
  bucket-credentials:
    name: bucket (credentials run out)
    runs-on: ubuntu-latest
    env:
      EFEMA_TEST_BUCKET: http://127.0.0.1:9000/efema-test
      EFEMA_TEST_BUCKET_REGION: us-east-1
      EFEMA_TEST_BUCKET_KEY: efema-ci
      EFEMA_TEST_BUCKET_SECRET: not-a-secret-a-throwaway-minio
      EFEMA_TEST_BUCKET_READER_KEY: efema-reader
      EFEMA_TEST_BUCKET_READER_SECRET: not-a-secret-either
      EFEMA_TEST_BUCKET_PREFIXED_KEY: efema-prefixed
      EFEMA_TEST_BUCKET_PREFIXED_SECRET: not-a-secret-at-all
      EFEMA_TEST_BUCKET_STS: http://127.0.0.1:9000
      EFEMA_TEST_BUCKET_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/minio
      - name: Wait for credentials to run out, and write with the next ones
        run: |
          cargo test -p efema --test bucket -- --ignored --exact credentials_that_ran_out_do_not_write_and_the_next_ones_do 2>&1 | tee "$RUNNER_TEMP/ran-out.log"
          grep -q '^test result: ok. 1 passed' "$RUNNER_TEMP/ran-out.log"

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used - so read it from the manifest and hold it to it.
  #
  # `max` over every package, not `.packages[0]`: cargo does not promise the
  # order, and picking the first crate would test whichever one it happened to
  # list - green on the wrong half of the repository.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from the manifest
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version] | max')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --workspace --all-targets

  # The format vectors come from a second implementation of the format, in
  # Python (ADR 0021): it writes them again here, and the file has to be what
  # it writes. The Rust side reads them back in the gate above. A venv, since
  # the runner's Python takes no packages system-wide.
  vectors:
    name: Format vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the vectors again, and compare
        run: |
          python3 -m venv "$RUNNER_TEMP/vectors"
          "$RUNNER_TEMP/vectors/bin/pip" install --quiet "cryptography>=44"
          "$RUNNER_TEMP/vectors/bin/python" tools/format-vectors.py --check

  # The one check a release tag waits for: every job above passed, or was
  # skipped on purpose. A tag held to the jobs themselves is held to their
  # names, and the first matrix that changes makes GitHub wait for a job that
  # no longer runs. `needs` alone would not do: a job whose dependency failed
  # is skipped, and a required check that was skipped counts as passed - so
  # this one runs always, and says.
  ci:
    name: ci
    if: always()
    needs:
      - check
      - first-sync
      - bucket
      - bucket-credentials
      - msrv
      - vectors
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "every job passed"
