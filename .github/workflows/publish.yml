name: Publish

# Triggered by the tag push directly (not the release event): releases here are
# created by release.yml with GITHUB_TOKEN, and such events do not start other
# workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish
        required: true

permissions: {}

jobs:
  # Nothing goes to crates.io before the release is out: a release that failed
  # to build should reach no registry, and `cargo install efema-server` would
  # otherwise offer a version the installers cannot download yet. Every job
  # below needs this one.
  release:
    name: Wait for the release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - name: Wait for release.yml on the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          started=$(date +%s)
          while :; do
            run=$(gh run list --workflow release.yml --commit "$sha" --limit 1 \
              --json status,conclusion,url --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none") \(.url // "-")"')
            read -r status conclusion url <<< "$run"
            case "$status/$conclusion" in
              completed/success) echo "release.yml put $TAG out: $url"; exit 0 ;;
              completed/*) echo "release.yml ended '$conclusion' for $TAG: $url" >&2; exit 1 ;;
              none/*)
                if [ $(( $(date +%s) - started )) -gt 600 ]; then
                  echo "release.yml has not started for $TAG in ten minutes" >&2
                  exit 1
                fi
                ;;
            esac
            sleep 30
          done

  crates-io:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # Every crate, in dependency order: crates.io resolves a dependency at
      # publish time and refuses a package whose dependency it cannot see yet.
      # Each crate at its own version - lacodda-seal and lacodda-tear do not
      # move with efema (docs/adr/0008-lacodda-seal-in-this-workspace.md,
      # docs/adr/0015-lacodda-tear-in-this-workspace.md). A version already on
      # crates.io is left out, so a run can be repeated - after a first version
      # published by hand, or a run that failed halfway - and a run with
      # nothing left to publish asks for no token at all.
      - name: Find what is not on crates.io yet
        id: pending
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          pending=""
          for crate in efema-proto lacodda-seal lacodda-tear efema-server efema; do
            version=$(echo "$metadata" | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if curl -sf "https://crates.io/api/v1/crates/$crate/$version" -H 'user-agent: efema-release' > /dev/null; then
              echo "$crate $version is on crates.io already"
            else
              pending="$pending $crate@$version"
            fi
          done
          echo "crates=${pending# }" >> "$GITHUB_OUTPUT"
      # The first version of each crate is published by hand: a trusted
      # publisher cannot be attached to a crate that does not exist yet. After
      # that each crate needs its own publisher on crates.io (repository
      # lacodda/efema, workflow publish.yml) - a missing one fails here with a
      # message about an invalid token, which is not what is wrong.
      - name: Get a crates.io token (OIDC trusted publishing)
        if: steps.pending.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.crates }}
        run: |
          for pending in $CRATES; do
            crate=${pending%@*}
            version=${pending#*@}
            cargo publish --package "$crate"
            # The index does not carry the new version the instant publish
            # returns, and the next crate resolves this one from it.
            for attempt in $(seq 1 30); do
              if curl -sf "https://crates.io/api/v1/crates/$crate/$version" -H 'user-agent: efema-release' > /dev/null; then
                continue 2
              fi
              echo "attempt $attempt: $crate $version is not indexed yet"
              sleep 10
            done
            echo "$crate $version never appeared in the index" >&2
            exit 1
          done
